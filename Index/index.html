<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container text-dark-emphasis bg-light-subtle border rounded-3" style="margin-top: 50px;">
        <div class="container-sm">
            
            <div style="margin-top: 50px;">
                <h3 class="text-center">Login</h3>
                <h6 class="text-center" style="color: gray;">Preencha os dados abaixo para realizar o login.</h6>
            </div>

            <form action="" id="formulario">
                
                <div class="col" style="margin: 20px;">
                    <label for="exampleFormControlInput1" class="form-label">Usuário</label>
                    <input id="usuario" type="text" class="form-control" placeholder="" aria-label="Usuário">
                </div>

                <div class="col" style="margin: 20px;">
                    <label for="exampleFormControlInput1" class="form-label">Senha</label>
                    <input id="senha" type="text" class="form-control" placeholder="" aria-label="Senha">
                </div>

                <button type="button" class="btn btn-danger" style="margin: 20px;">Entrar</button>

            </form>

            <div class="resultado" id="resultado"></div>

        </div>
    </div>

    <img id="HomemAranha" src="Imagens/HomemAranha.jpg" alt="Spider Man">

    <script src="script.js"></script>

</body>

</html>
